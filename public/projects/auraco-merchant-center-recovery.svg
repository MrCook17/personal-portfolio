<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">Aura Co Merchant Center recovery diagram</title>
  <desc id="desc">Diagram representing the recovery of an ecommerce product feed with 2,010 products and 1,709 URL mismatches.</desc>
  <defs>
    <linearGradient id="panel" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#ffffff" />
      <stop offset="1" stop-color="#f3f7f6" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#0f172a" flood-opacity="0.16" />
    </filter>
  </defs>
  <rect width="1200" height="675" fill="#eef3f1" />
  <rect x="78" y="70" width="1044" height="535" rx="28" fill="url(#panel)" filter="url(#shadow)" />
  <rect x="78" y="70" width="1044" height="68" rx="28" fill="#17202a" />
  <circle cx="122" cy="104" r="10" fill="#ef6f6c" />
  <circle cx="154" cy="104" r="10" fill="#f4c15d" />
  <circle cx="186" cy="104" r="10" fill="#75c68f" />
  <text x="600" y="112" fill="#f8fafc" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" text-anchor="middle">Merchant Center recovery model</text>

  <g transform="translate(126 178)">
    <rect width="240" height="150" rx="18" fill="#ffffff" stroke="#9aa9a5" stroke-width="2" />
    <text x="120" y="42" fill="#17202a" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" text-anchor="middle">Shopify feed</text>
    <text x="120" y="84" fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="800" text-anchor="middle">2,010</text>
    <text x="120" y="116" fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="19" text-anchor="middle">connected products</text>
  </g>

  <g transform="translate(480 178)">
    <rect width="240" height="150" rx="18" fill="#fff8ec" stroke="#d3992f" stroke-width="2" />
    <text x="120" y="42" fill="#17202a" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" text-anchor="middle">URL mismatch</text>
    <text x="120" y="84" fill="#92400e" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="800" text-anchor="middle">1,709</text>
    <text x="120" y="116" fill="#78350f" font-family="Arial, Helvetica, sans-serif" font-size="19" text-anchor="middle">products affected</text>
  </g>

  <g transform="translate(834 178)">
    <rect width="240" height="150" rx="18" fill="#edfdf4" stroke="#3d9b68" stroke-width="2" />
    <text x="120" y="42" fill="#17202a" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" text-anchor="middle">Recovery</text>
    <text x="120" y="84" fill="#166534" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="800" text-anchor="middle">15 Jul</text>
    <text x="120" y="116" fill="#166534" font-family="Arial, Helvetica, sans-serif" font-size="19" text-anchor="middle">suspension removed</text>
  </g>

  <path d="M382 253h78" stroke="#64748b" stroke-width="5" stroke-linecap="round" />
  <path d="m454 236 24 17-24 17" fill="none" stroke="#64748b" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M736 253h78" stroke="#64748b" stroke-width="5" stroke-linecap="round" />
  <path d="m808 236 24 17-24 17" fill="none" stroke="#64748b" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />

  <g transform="translate(126 390)">
    <rect width="948" height="120" rx="20" fill="#f8fafc" stroke="#cbd5e1" stroke-width="2" />
    <text x="40" y="42" fill="#17202a" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700">Evidence-led remediation</text>
    <text x="40" y="76" fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="20">Domain and policy alignment</text>
    <text x="346" y="76" fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="20">Feed resynchronisation</text>
    <text x="628" y="76" fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="20">Structured Google review</text>
  </g>
</svg>
